[project]
name = "pymc-challenges"
version = "0.1.0"
description = "Worked examples and real-data challenges for Bayesian modelling with PyMC 6"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "diffrax>=0.7.2",
    "equinox>=0.13.8",
    "flowjax>=19.1.1",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jax>=0.11.2",
    "jupyterlab>=4.6.3",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "nutpie>=0.16.11",
    "pandas>=3.0.6",
    "patsy>=1.0.3",
    "preliz>=0.28.0",
    "pyarrow>=25.0.1",
    "pymc>=6.3.2",
    "pymc-bart>=0.13.1",
    "pymc-extras>=0.15.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymc_challenges"]
