# Publish the notebooks as a website on GitHub Pages.
# Repository Settings -> Pages -> Source: "GitHub Actions".
# Pages are rendered from the committed, executed notebooks; nothing is re-run here.
name: Pages

on:
  push:
    branches: [main]
    paths: ["notebooks/**", "tools/build_site.py", "tools/site_content.py", "tools/site_assets/**",
            "src/pymc_challenges/hints/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nbformat nbconvert pygments pyyaml
      - run: python tools/build_site.py --out _site --repo-url "${{ github.server_url }}/${{ github.repository }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
